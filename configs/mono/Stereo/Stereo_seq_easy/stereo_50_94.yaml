inherit_from: "configs/mono/Stereo/Stereo_seq_easy/base_config.yaml"

Dataset:
  begin: 45  # 从000045开始
  end: 95    # 到000094结束（包含45-94，共50张）
  dataset_path: "datasets/StereoMIS/stereo_seq_easy/stereo_seq_easy/train"
  Calibration:
    fx: 516.95
    fy: 516.86
    cx: 302.29
    cy: 241.49
    k1: -0.00020782629144378
    k2: 0.000180254035512917
    p1: 0.0
    p2: 0.0
    k3: 9.6945594123099e-05
    width: 640
    height: 480
    depth_scale: 1000.0
    distorted: False

opt_params:
    position_lr_init: 0.0016
    position_lr_final: 0.00016
    init_lr: 6 

Training:
    alpha: 0.98
    mapping_itr_nosingle: 30

# ================= 优化内存使用 =================
Dataset:
  # 降低轮廓点保留率，减少内存占用
  edge_keep_ratio: 0.2            # 从0.5降低到0.2，减少轮廓点保留
  pcd_downsample: 512             # 增加下采样强度（从256增加到512）
  pcd_downsample_init: 256       # 增加初始化下采样（从128增加到256）

edge_extraction:
  # 调整轮廓提取参数，减少识别的轮廓点数量
  edge_ratio: 0.05                # 从0.1降低到0.05，只识别5%的点为轮廓点
  curvature_threshold: 0.15      # 从0.1提高到0.15，提高轮廓识别阈值
  max_points: 10000              # 从20000降低到10000，减少处理点数

# rgb_edge_pnp 覆盖（STAR-Edge 3D 轮廓引导，stereo_50_94 内存优化）
rgb_edge_pnp:
  edge_guided_matching: true
  edge_match_mode: "weight"
  edge_match_ratio: 0.5
  edge_3d_weight: 2.0

  edge_extraction:
    method: 'star_edge'
    edge_ratio: 0.05              # 从0.1降低到0.05，减少轮廓点
    curvature_threshold: 0.15
    max_points: 10000
    knn_neighbors: 15
    voxel_size: 0.02

