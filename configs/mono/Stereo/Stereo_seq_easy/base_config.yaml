Dataset:
  Calibration:
    cx: 302.29
    cy: 241.49
    depth_scale: 1000.0
    distorted: false
    fx: 516.95
    fy: 516.86
    height: 480
    k1: -0.00020782629144378
    k2: 0.000180254035512917
    k3: 9.6945594123099e-05
    p1: 0.0
    p2: 0.0
    width: 640
  adaptive_pointsize: true
  begin: 0
  dataset_path: datasets/StereoMIS/stereo_seq_easy/stereo_seq_easy/train
  depth_loss: true
  pcd_downsample: 256
  pcd_downsample_init: 128
  point_size: 0.003
  sensor_type: monocular
  type: tum
  # 轮廓引导采样配置（在下采样前使用原始点云提取轮廓）
  edge_guided_sampling: true      # 启用轮廓引导采样
  edge_keep_ratio: 0.5            # 轮廓点保留比例（0.5表示保留50%的轮廓点）
  save_edge_visualization: true   # 保存轮廓可视化图片（PLY点云、mask、叠加图）
Results:
  color_refinement: true
  eval_rendering: true
  global_BA: false
  save_dir: "results"
  save_results: true
  save_trj: true
  save_trj_kf_intv: 10
  use_gui: false
  use_wandb: false
Training:
  use_optical_flow: True
  use_camera_flow: True
  flow_visualization: True
  use_gt_pose: True  # 使用真值位姿计算camera flow
  flow_loss_weight: 0.1  # flow loss权重（降低以避免错误flow主导优化）
  flow_warm_up: 1000  # 在warm_up之后才开始计算flow loss
  flow_loss_interval: 20  # 每N次map迭代才计算一次flow loss，避免每迭代都渲染+GS Flow导致卡顿（默认5，提速可改为10-20）
  flow_on_all_frames: false  # 若为true，在所有窗口frame对上计算flow loss；若为false（默认），只在最近N对上计算
  flow_max_pairs: 1  # 最多在最近的几对关键帧上计算flow loss（默认1，即只计算最新一对：如5->10）
  use_flow_rasterizer: True  # 启用完整MotionGS光流光栅化器（返回10个输出，支持各向异性光流）
  flow_rasterizer_fallback: True  # 光流光栅化器不可用时自动降级到简化模式
  a_invalid: 1.1
  a_valid: 0.1
  alpha: 0.98
  edge_threshold: 1.1
  gaussian_extent: 0.4
  gaussian_reset: 2001
  gaussian_th: 0.7
  gaussian_update_every: 150
  gaussian_update_offset: 50
  global_BA_itr_num: 500
  init_gaussian_extent: 8
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_update: 100
  init_itr_num: 1050
  kf_cutoff: 0.3
  kf_interval: 5
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_translation: 0.08
  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001
  mapping_itr_nosingle: 30
  mapping_itr_num: 220
  pose_window: 3
  prune_mode: slam
  prune_num: 4
  rgb_boundary_threshold: 0.01
  single_thread: false
  size_threshold: 8
  spherical_harmonics: false
  tracking_itr_num: 100
  window_size: 8

# ================= MASt3R 点云轮廓提取（每帧）可视化保存 =================
# 说明：
# - 轮廓提取直接作用于 MASt3R 输出的 pred['pts3d'] 点云（每帧）
# - 输出到 results/.../viz_mast3r_pc_edge/ 下：
#   - fXXXXXX_score.png / fXXXXXX_mask.png / fXXXXXX_overlay.png / fXXXXXX_pc_edge.ply
mast3r_edge_viz:
  enabled: true
  edge_border_margin: 30    # 排除图像边缘 30 像素的 3D 点（避免 STAR-Edge 边界噪声）
  # 若要"每帧"都跑 star-edge：设为 1；若只测首帧：设很大（如 999999）
  viz_every: 1
  # 想要 <1s/帧：建议先关闭 PLY 写盘（避免IO影响），只保留 png（score/mask/overlay）
  save_ply: false
  max_ply_points: 50000
  # 可选：覆盖 edge_extraction 配置（不填则沿用全局 edge_extraction 的默认值）
  edge_extraction:
    method: 'star_edge'
    star_edge_cuda: true
    # 更稠密：降低阈值（越小越稠密，常用 0.2~0.4）
    star_edge_threshold: 0.35
    # CUDA kernel 加速后可大幅调高（30K 约 15ms/帧）
    star_edge_max_points: 30000
    # 邻域规模/采样数（CUDA下可恢复默认值以提高质量）
    star_edge_kk: 26
    star_edge_sample_num: 30
    # 打印每次STAR-Edge推理耗时（LocalSH / MLP / total）
    star_edge_profile: true
config_file_path: configs/mono/Stereo/Stereo_seq_easy/stereo_full.yaml
depth:
  error_threshold: 0.08
  final_error_threshold: 0.15
  mean_threshold: 0.3
  min_accurate_pixels_ratio: 0.01
  patch_size: 10
  std_threshold: 0.3
model_params:
  data_device: cuda
  deform_table_threshold: 0.0001
  model_path: ''
  resolution: -1
  sh_degree: 0
  source_path: ''
  white_background: false
opt_params:
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold: 0.0001
  densify_until_iter: 22000
  feature_lr: 0.003
  init_lr: 6
  iterations: 30000
  lambda_dssim: 0.2
  opacity_lr: 0.06
  opacity_reset_interval: 2000
  percent_dense: 0.025
  position_lr_delay_mult: 0.01
  position_lr_final: 0.00016
  position_lr_init: 0.0016
  position_lr_max_steps: 30000
  rotation_lr: 0.001
  scaling_lr: 0.0008
pipeline_params:
  compute_cov3D_python: false
  convert_SHs_python: false
rgb_edge_pnp:
  iterations: 200
  reproj_error: 8.0
  min_sample: 4
  seed: 0

  # ========== 3D点云轮廓引导匹配（STAR-Edge）==========
  center_crop_ratio: 1.0            # 中心裁剪面积比例(1.0=不裁剪, 0.6=保留中心60%面积)
  edge_guided_matching: true       # 启用3D点云轮廓引导的匹配点筛选/加权
  edge_match_mode: "weight"        # "filter" 或 "weight" - 筛选模式或加权模式
  edge_match_ratio: 0.5            # filter模式下的轮廓匹配点保留比例
  edge_3d_weight: 2.0              # weight模式下轮廓区域的3D匹配点权重倍数

  # 3D点云轮廓提取参数（用于edge_guided_matching）
  edge_extraction:
    method: 'star_edge'            # 'star_edge' - 使用STAR-Edge的LocalSH方法（如果可用，否则回退到fast_curvature）
    star_edge_cuda: true
    knn_neighbors: 15
    curvature_threshold: 0.3
    edge_ratio: 0.5                # 保留的边缘点比例
    voxel_size: 0.02
    max_points: 150000

# ================= 轮廓提取配置（用于轮廓引导采样）=================
# 说明：
# - 用于在下采样前从原始点云提取轮廓信息
# - 轮廓区域的点会有更高的保留率，提高重建质量
# - 使用STAR-Edge的LocalSH方法（如果可用）或快速曲率方法
edge_extraction:
  method: 'star_edge'                # 'star_edge', 'localsh', 'fast_curvature', 'depth_gradient', 'hybrid'
  star_edge_cuda: true               # 启用 CUDA kernel 加速路径
  
  # 快速曲率方法参数（用于3D点云轮廓提取）
  knn_neighbors: 15                  # KNN邻域大小
  curvature_threshold: 0.1           # 曲率阈值
  edge_ratio: 0.1                    # 保留的边缘点比例
  
  # 下采样参数（轮廓提取前的预处理）
  voxel_size: 0.02                   # 体素大小（用于快速下采样加速计算）
  max_points: 20000                  # 最大点数限制（避免内存问题）
  min_points_ratio: 0.05
