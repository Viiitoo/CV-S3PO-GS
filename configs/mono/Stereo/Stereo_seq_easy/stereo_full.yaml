inherit_from: "configs/mono/Stereo/Stereo_seq_easy/base_config.yaml"

Dataset:
  begin: 0
  # end: null  # 不设置 end 表示读取完整数据集（200张）
  dataset_path: "datasets/StereoMIS/stereo_seq_easy/stereo_seq_easy/train"
  Calibration:
    fx: 516.95
    fy: 516.86
    cx: 302.29
    cy: 241.49
    k1: -0.00020782629144378
    k2: 0.000180254035512917
    p1: 0.0
    p2: 0.0
    k3: 9.6945594123099e-05
    width: 640
    height: 480
    depth_scale: 1000.0
    distorted: False

opt_params:
    position_lr_init: 0.0016
    position_lr_final: 0.00016
    init_lr: 6

Training:
    alpha: 0.98
    mapping_itr_nosingle: 30
    # 光流相关配置（可选，默认从base_config继承）
    use_gt_pose: True  # 使用真值位姿模式（用于测试光流功能）
    # use_optical_flow: False  # 启用optical flow计算
    # use_camera_flow: False  # 启用camera flow计算
    # flow_visualization: False  # 是否保存光流可视化图像

# Flow配置（可选，默认从base_config继承）
