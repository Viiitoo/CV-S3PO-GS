Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 10
  use_gui: False
  eval_rendering: True
  use_wandb: False
  color_refinement: True
  global_BA: False
  checkpoint_iterations: []  # 在哪些迭代保存checkpoint，例如: [1000, 3000, 5000]

Dataset:
  type: 'tum'
  sensor_type: 'monocular'
  depth_loss: False
  pcd_downsample: 256
  pcd_downsample_init: 128
  adaptive_pointsize: True
  point_size: 0.01

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 100
  mapping_itr_num: 150
  global_BA_itr_num: 500
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 5
  window_size: 8
  pose_window: 3
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01
  alpha: 0.98
  kf_translation: 0.08
  kf_min_translation: 0.05
  kf_overlap: 0.90
  kf_cutoff: 0.3
  prune_mode: 'slam'
  prune_num: 1
  single_thread: True
  spherical_harmonics: False
  use_gt_pose: False  # 使用真值位姿模式（用于测试光流功能）
  use_optical_flow: False  # 启用optical flow计算
  use_camera_flow: False  # 启用camera flow计算
  flow_visualization: False  # 是否保存光流可视化图像

  mapping_itr_nosingle: 10
  a_invalid: 0.5
  a_valid: 0.2

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001

opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.00016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  init_lr: 6
  
  # ========== 形变相关学习率参数（新增）==========
  # 这些参数控制形变参数（位置、旋转、放缩、不透明度的形变权重）的学习速度
  # 
  # deformation_lr_init: 形变参数的初始学习率
  #   值越小，形变参数变化越慢，训练越稳定，但可能需要更多迭代次数
  #   推荐值：0.00016（是位置学习率的10%）
  deformation_lr_init: 0.00016
  
  # deformation_lr_final: 形变参数的最终学习率
  #   训练后期会逐渐降低到这个值，让模型更精细地调整
  #   推荐值：0.000016（是初始值的10%）
  deformation_lr_final: 0.000016
  
  # deformation_lr_delay_mult: 学习率延迟倍数
  #   控制学习率衰减的速度，值越小衰减越快
  #   推荐值：0.01
  deformation_lr_delay_mult: 0.01

depth:
  patch_size: 10
  mean_threshold: 0.3
  std_threshold: 0.3
  error_threshold: 0.1
  final_error_threshold: 0.15
  min_accurate_pixels_ratio: 0.01

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"
  # 时间基函数数量（可选，默认17）
  # EH-SurGS使用17-20个，更多基函数可以表达更复杂的时间变化
  # 但会增加内存：每点约增加 (K_time-3) * (3+4+3+1) = (K_time-3) * 11 个参数
  # 例如：K_time=17时，每点增加约154个参数（相比K_time=3）
  time_basis_num: 17
  # ========== 形变表相关参数（新增）==========
  # deform_table_threshold: 形变表阈值，只有形变量超过此值的点才会被标记为需要形变
  #   值越小，更多点会被标记为需要形变，建模效果可能更好但计算开销更大
  #   值越大，只有形变量大的点才需要形变，计算更快但可能丢失细节
  #   推荐值：0.0001-0.001（比默认0.01小100-10倍），根据场景动态调整
  #   如果建模效果差（点太少），可以降低此值
  deform_table_threshold: 0.0001

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False

# ================= 3D点云轮廓引导PnP（STAR-Edge，用于初始化相对位姿） =================
# 说明：
# - 仅影响 `utils/init_pose.get_pose()` 中的PnP初值，不影响后续基于GS渲染的tracking优化
# - 在渲染深度生成的3D点云上提取轮廓（STAR-Edge），将分数映射到匹配点做加权/筛选
rgb_edge_pnp:
  iterations: 100
  reproj_error: 5.0
  min_sample: 6
  seed: 0

  edge_guided_matching: false       # 启用3D点云轮廓引导的匹配点筛选/加权
  edge_match_mode: "weight"         # "filter" 或 "weight"
  edge_match_ratio: 0.5             # filter模式下的轮廓匹配点保留比例
  edge_3d_weight: 2.0               # weight模式下轮廓区域的3D匹配点权重倍数

  edge_extraction:
    method: 'star_edge'
    knn_neighbors: 15
    curvature_threshold: 0.3
    edge_ratio: 0.5
    voxel_size: 0.02
    max_points: 15000

Flow:
  model_path: "./gmflow/checkpoints/gmflow_sintel-0c07dcb3.pth"
  model_type: "gmflow"  # 可选: gmflow, raft, flowformer
